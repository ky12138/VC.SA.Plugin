name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }} (x86)
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            preset: x86-release
          - config: Debug
            preset: x86-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # preset 里指定 CMAKE_C(XX)_COMPILER=cl.exe，需要先把 x86 MSVC 环境注入 PATH。
      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          # VS 的开发环境（vcvars）会把 VCPKG_ROOT 指向 VS 自带的 manifest-only 副本，
          # 该副本不支持 classic mode。这里显式改回运行器自带的独立 vcpkg 实例。
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            throw "vcpkg.exe not found under $vcpkgRoot"
          }

          Write-Host "Using vcpkg at $vcpkgRoot"
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          # vcpkg 的端口名是 utfcpp，安装后 CMake 包名是 utf8cpp。
          & "$vcpkgRoot\vcpkg.exe" install utfcpp:x86-windows-static

      - name: Configure
        run: cmake --preset windows-x86-base

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmhhz-vcsa-${{ matrix.config }}
          path: |
            out/build/windows-x86-base/${{ matrix.config }}/*.asi
            out/build/windows-x86-base/${{ matrix.config }}/*.exe
            out/build/windows-x86-base/${{ matrix.config }}/*.pdb
          if-no-files-found: error
          retention-days: 14
